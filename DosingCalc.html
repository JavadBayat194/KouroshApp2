<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DosingCalc">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e3c72">
    <title>DosingCalc</title>
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231e3c72'/><text y='.9em' font-size='50' x='50%' text-anchor='middle' fill='white'>💉</text></svg>">
    <style>
        * { box-sizing: border-box; font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            background: linear-gradient(145deg, #1e3c72, #2a5298);
            min-height: 100vh; min-height: -webkit-fill-available;
            display: flex; justify-content: center; align-items: center;
            margin: 0; padding: 16px; padding-bottom: env(safe-area-inset-bottom);
        }
        .container {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius: 26px; padding: 22px 18px; max-width: 460px; width: 100%;
            box-shadow: 0 25px 50px -8px rgba(0,0,0,0.45);
            border: 1px solid rgba(255,255,255,0.3);
        }
        h1 {
            font-size: 21px; font-weight: 700; color: #0b2a4a;
            text-align: center; margin: 0 0 16px 0;
            border-bottom: 2px solid #e0e7f0; padding-bottom: 10px;
        }
        .form-group { margin-bottom: 13px; }
        label { display: block; font-weight: 600; color: #1e3a5f; font-size: 13px; margin-bottom: 4px; }
        select, input {
            width: 100%; padding: 12px 14px; border: 2px solid #dce3ed;
            border-radius: 14px; font-size: 16px; background: white;
            outline: none; color: #0b1e33; -webkit-appearance: none; appearance: none;
        }
        select:focus, input:focus { border-color: #2a5298; box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.15); }
        .btn {
            width: 100%; padding: 14px; background: linear-gradient(145deg, #1e3c72, #2a5298);
            color: white; border: none; border-radius: 50px; font-size: 17px; font-weight: 700;
            margin: 6px 0 10px; box-shadow: 0 8px 20px rgba(42, 82, 152, 0.35);
        }
        .btn:active { transform: scale(0.97); }
        .result-box {
            background: #eef3f9; border-radius: 16px; padding: 14px 13px;
            margin-top: 6px; border-left: 6px solid #1e3c72;
            min-height: 70px; font-size: 14px; line-height: 1.7; color: #0a1f38;
        }
        .result-box strong { color: #0b3b6b; }
        .footer-note { font-size: 11px; color: #4a5e7a; text-align: center; margin-top: 10px; opacity: 0.75; }
        .highlight { background: #dbe7f5; padding: 7px 11px; border-radius: 11px; display: block; margin-top: 7px; }
        .big-num { font-size: 17px; color: #1a4f8b; font-weight: 700; }
        
        #passwordScreen { display: block; }
        #appContent { display: none; }
        .password-box { text-align: center; }
        .password-box h2 { color: #0b2a4a; margin-bottom: 18px; font-size: 21px; }
        .error-msg { color: #b91c1c; font-size: 13px; margin-top: 8px; display: none; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="container">
    <!-- Password Screen -->
    <div id="passwordScreen" class="password-box">
        <h2>🔒 DosingCalc</h2>
        <div class="form-group">
            <label for="passwordInput">Enter Password:</label>
            <input type="password" id="passwordInput" placeholder="Password">
        </div>
        <button class="btn" id="loginBtn">Unlock</button>
        <div class="error-msg" id="errorMsg">Wrong password. Try again.</div>
    </div>

    <!-- Main App -->
    <div id="appContent">
        <h1>💉 DosingCalc</h1>

        <!-- What to calculate -->
        <div class="form-group">
            <label for="calcMode">What do you want to calculate?</label>
            <select id="calcMode">
                <option value="injection">Injection Rate</option>
                <option value="dose">Final Dose (mg/L)</option>
                <option value="stock">Stock Concentration</option>
                <option value="flow">Flow Rate (L/s)</option>
            </select>
        </div>

        <!-- Stock Unit -->
        <div class="form-group" id="stockUnitGroup">
            <label for="stockUnit">Stock Unit:</label>
            <select id="stockUnit">
                <option value="percent">Percent (%)</option>
                <option value="mgL">mg/L</option>
            </select>
        </div>

        <!-- Injection Unit -->
        <div class="form-group" id="injUnitGroup">
            <label for="injUnit">Injection Unit:</label>
            <select id="injUnit">
                <option value="Lmin">L/min</option>
                <option value="ccs">cc/s</option>
            </select>
        </div>

        <!-- Inputs -->
        <div class="form-group" id="stockGroup">
            <label id="lblStock" for="stockInput">Stock Concentration:</label>
            <input type="number" id="stockInput" step="any" placeholder="e.g. 1" inputmode="decimal">
        </div>

        <div class="form-group" id="doseGroup">
            <label for="doseInput">Final Dose (mg/L):</label>
            <input type="number" id="doseInput" step="any" placeholder="e.g. 3" inputmode="decimal">
        </div>

        <div class="form-group" id="flowGroup">
            <label for="flowInput">Flow Rate (L/s):</label>
            <input type="number" id="flowInput" step="any" placeholder="e.g. 400" inputmode="decimal">
        </div>

        <div class="form-group" id="injGroup">
            <label id="lblInj" for="injInput">Injection Rate:</label>
            <input type="number" id="injInput" step="any" placeholder="e.g. 0.5" inputmode="decimal">
        </div>

        <button class="btn" id="calcBtn">⚡ Calculate</button>

        <div class="result-box" id="resultBox">
            <span style="opacity:0.6;">🔹 Result will appear here</span>
        </div>

        <div class="footer-note">1% = 10,000 mg/L • Mass balance calculation</div>
    </div>
</div>

<script>
(function() {
    const correctPassword = "Om1234";
    const passwordScreen = document.getElementById('passwordScreen');
    const appContent = document.getElementById('appContent');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');

    function checkPassword() {
        if (passwordInput.value === correctPassword) {
            passwordScreen.style.display = 'none';
            appContent.style.display = 'block';
        } else {
            errorMsg.style.display = 'block';
            passwordInput.value = '';
            passwordInput.focus();
        }
    }
    loginBtn.addEventListener('click', checkPassword);
    passwordInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); checkPassword(); }
    });

    // Elements
    const calcMode = document.getElementById('calcMode');
    const stockUnit = document.getElementById('stockUnit');
    const injUnit = document.getElementById('injUnit');
    const stockInput = document.getElementById('stockInput');
    const doseInput = document.getElementById('doseInput');
    const flowInput = document.getElementById('flowInput');
    const injInput = document.getElementById('injInput');
    const resultBox = document.getElementById('resultBox');
    const lblStock = document.getElementById('lblStock');
    const lblInj = document.getElementById('lblInj');

    const stockGroup = document.getElementById('stockGroup');
    const doseGroup = document.getElementById('doseGroup');
    const flowGroup = document.getElementById('flowGroup');
    const injGroup = document.getElementById('injGroup');
    const stockUnitGroup = document.getElementById('stockUnitGroup');
    const injUnitGroup = document.getElementById('injUnitGroup');

    function updateUI() {
        const mode = calcMode.value;

        // Show/hide groups
        stockGroup.classList.toggle('hidden', mode === 'stock');
        doseGroup.classList.toggle('hidden', mode === 'dose');
        flowGroup.classList.toggle('hidden', mode === 'flow');
        injGroup.classList.toggle('hidden', mode === 'injection');

        // Units visibility
        stockUnitGroup.classList.toggle('hidden', mode === 'stock');
        injUnitGroup.classList.toggle('hidden', mode === 'injection');

        // Labels
        if (stockUnit.value === 'percent') {
            lblStock.textContent = 'Stock Concentration (%):';
            stockInput.placeholder = 'e.g. 1';
        } else {
            lblStock.textContent = 'Stock Concentration (mg/L):';
            stockInput.placeholder = 'e.g. 10000';
        }

        if (injUnit.value === 'Lmin') {
            lblInj.textContent = 'Injection Rate (L/min):';
            injInput.placeholder = 'e.g. 0.5';
        } else {
            lblInj.textContent = 'Injection Rate (cc/s):';
            injInput.placeholder = 'e.g. 8.33';
        }
    }

    calcMode.addEventListener('change', updateUI);
    stockUnit.addEventListener('change', updateUI);
    injUnit.addEventListener('change', updateUI);
    updateUI();

    function formatNumber(num) {
        if (num === 0) return '0';
        if (Math.abs(num) >= 1000) return num.toFixed(2);
        if (Math.abs(num) >= 1) return num.toFixed(3);
        if (Math.abs(num) >= 0.01) return num.toFixed(4);
        return num.toExponential(3);
    }

    function calculate() {
        const mode = calcMode.value;
        let stockVal = parseFloat(stockInput.value);
        let doseVal = parseFloat(doseInput.value);
        let flowVal = parseFloat(flowInput.value);
        let injVal = parseFloat(injInput.value);

        // Convert stock to mg/L
        let stockMgL = null;
        if (!isNaN(stockVal)) {
            stockMgL = (stockUnit.value === 'percent') ? stockVal * 10000 : stockVal;
        }

        // Convert injection to L/s
        let injLs = null;
        if (!isNaN(injVal)) {
            if (injUnit.value === 'Lmin') {
                injLs = injVal / 60;
            } else {
                injLs = injVal / 1000; // cc/s → L/s
            }
        }

        let resultHTML = '';

        try {
            if (mode === 'injection') {
                if (isNaN(stockMgL) || isNaN(doseVal) || isNaN(flowVal) || stockMgL <= 0 || doseVal <= 0 || flowVal <= 0) {
                    throw 'Please enter valid positive numbers for Stock, Dose and Flow.';
                }
                if (doseVal >= stockMgL) throw 'Dose cannot be ≥ Stock concentration.';

                const qLs = (flowVal * doseVal) / stockMgL;
                const qLmin = qLs * 60;
                const qCcs = qLs * 1000;

                resultHTML = `
                    <div><strong>✅ Required Injection Rate:</strong></div>
                    <div class="highlight">🔸 <span class="big-num">${formatNumber(qLmin)}</span> L/min</div>
                    <div class="highlight">🔸 <span class="big-num">${formatNumber(qCcs)}</span> cc/s</div>
                    <div class="highlight">🔸 <span class="big-num">${formatNumber(qLs)}</span> L/s</div>
                `;
            }
            else if (mode === 'dose') {
                if (isNaN(stockMgL) || isNaN(injLs) || isNaN(flowVal) || stockMgL <= 0 || injLs <= 0 || flowVal <= 0) {
                    throw 'Please enter valid positive numbers for Stock, Injection and Flow.';
                }
                const dose = (injLs * stockMgL) / flowVal;
                resultHTML = `
                    <div><strong>✅ Final Dose:</strong></div>
                    <div class="highlight">🔸 <span class="big-num">${formatNumber(dose)}</span> mg/L</div>
                `;
            }
            else if (mode === 'stock') {
                if (isNaN(doseVal) || isNaN(injLs) || isNaN(flowVal) || doseVal <= 0 || injLs <= 0 || flowVal <= 0) {
                    throw 'Please enter valid positive numbers for Dose, Injection and Flow.';
                }
                const stockMgL_calc = (flowVal * doseVal) / injLs;
                const stockPercent = stockMgL_calc / 10000;

                resultHTML = `
                    <div><strong>✅ Required Stock Concentration:</strong></div>
                    <div class="highlight">🔸 <span class="big-num">${formatNumber(stockPercent)}</span> %</div>
                    <div class="highlight">🔸 <span class="big-num">${formatNumber(stockMgL_calc)}</span> mg/L</div>
                `;
            }
            else if (mode === 'flow') {
                if (isNaN(stockMgL) || isNaN(doseVal) || isNaN(injLs) || stockMgL <= 0 || doseVal <= 0 || injLs <= 0) {
                    throw 'Please enter valid positive numbers for Stock, Dose and Injection.';
                }
                if (doseVal >= stockMgL) throw 'Dose cannot be ≥ Stock concentration.';

                const flow = (injLs * stockMgL) / doseVal;
                resultHTML = `
                    <div><strong>✅ Required Flow Rate:</strong></div>
                    <div class="highlight">🔸 <span class="big-num">${formatNumber(flow)}</span> L/s</div>
                `;
            }
        } catch (err) {
            resultBox.innerHTML = `<span style="color:#b91c1c;">⚠️ ${err}</span>`;
            return;
        }

        resultBox.innerHTML = resultHTML;
    }

    document.getElementById('calcBtn').addEventListener('click', calculate);
    
    // Enter key support
    document.querySelectorAll('#appContent input, #appContent select').forEach(el => {
        el.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                calculate();
            }
        });
    });
})();
</script>
</body>
</html>
